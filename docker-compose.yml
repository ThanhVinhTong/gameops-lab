services:
  localstack:
    # LocalStack-specific: the image may be overridden in .env.
    image: ${LOCALSTACK_IMAGE:-localstack/localstack-pro:latest}
    ports:
      - "4566:4566"
    environment:
      # LocalStack-specific: keep the real token in uncommitted .env only.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: lambda,apigateway,events,sqs,dynamodb,cloudformation,iam,logs,sts
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-southeast-1}
    volumes:
      # LocalStack-generated state is ignored by Git.
      - "./.localstack:/var/lib/localstack"
      # Future Lambda emulation uses the host Docker engine.
      - "/var/run/docker.sock:/var/run/docker.sock"
