# AWS CloudFormation template for GameOps Lab.
# Uses the AWS Serverless Application Model (AWS SAM) transform.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Conceptual serverless infrastructure skeleton for GameOps Lab.

# Planned event flow:
# HTTP API
#   -> session-ingest Lambda
#   -> custom EventBridge event bus
#   -> SessionEnded EventBridge rule
#   -> SQS work queue, with a dead-letter queue
#   -> session-analytics Lambda
#   -> DynamoDB session analytics table
#
# Planned resources:
# - AWS::Serverless::HttpApi
# - Two AWS::Serverless::Function resources
# - AWS::Events::EventBus
# - AWS::Events::Rule
# - Two AWS::SQS::Queue resources
# - AWS::DynamoDB::Table
Resources: {}
